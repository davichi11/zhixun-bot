# 宿主机 Nginx 示例（生产部署时用，见第 9 篇）
#
# 放到 /etc/nginx/conf.d/zhixun.conf 后：
#   nginx -t && systemctl reload nginx
#
# 证书申请（推荐）：
#   certbot --nginx -d zhixun.example.com

# HTTP → HTTPS 跳转
server {
    listen 80;
    server_name zhixun.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name zhixun.example.com;

    ssl_certificate     /etc/letsencrypt/live/zhixun.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zhixun.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 前端静态产物（也可直接指到容器端口）
    root /var/www/zhixun;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # 访问日志单独存放，便于按 run_id 排查
    access_log /var/log/nginx/zhixun.access.log;
    error_log  /var/log/nginx/zhixun.error.log;
}
