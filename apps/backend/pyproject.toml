[project]
name = "zhixun-backend"
version = "0.1.0"
description = "智讯助手 · Agno 后端服务（Agent 流水线 + HTTP API + 调度器）"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    # ---- Agent 框架 ----
    "agno>=2.0.0",
    # ---- Web ----
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    # ---- 配置与日志 ----
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.1",
    "structlog>=24.4.0",
    # ---- 数据库（开发期 aiosqlite / 生产期 asyncpg）----
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.13.3",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.30.0",
    # ---- 向量库 ----
    "lancedb>=0.13.0",
    # ---- 调度 ----
    "apscheduler>=3.10.4",
    # ---- HTTP 客户端（工具层用）----
    "httpx>=0.27.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[project.scripts]
zhixun = "zhixun.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zhixun"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["zhixun"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["agno.*", "lancedb.*", "apscheduler.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "unit: 单元测试（LLM 必须 mock）",
    "integration: 集成测试（需要真实 DB）",
    "e2e: 端到端测试（需要真实 LLM，默认跳过）",
]
