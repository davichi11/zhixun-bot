name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端（lint + typecheck + test）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: uv sync --extra dev

      - name: Ruff 检查
        run: uv run ruff check .

      - name: Ruff 格式检查
        run: uv run ruff format --check .

      - name: mypy 类型检查
        run: uv run mypy src

      # 单元测试里不调用真实 LLM，所以不需要任何密钥
      - name: 单元测试
        run: uv run pytest -m unit

      - name: 集成测试
        run: uv run pytest -m integration

  frontend:
    name: 前端（typecheck + build）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: 构建
        run: pnpm build
